# Host nginx server block for Sphero Tournament.
#
# This is the nginx that runs ON the Ubuntu host and owns the domain,
# the certificate, and ports 80/443. It is NOT the nginx inside the
# container — that one (../../nginx.conf) serves the built files and is
# not touched here.
#
# Install:
#   sudo cp deploy/nginx/sphero.dannyslab.com.conf \
#     /etc/nginx/sites-available/sphero.dannyslab.com
#   sudo ln -s /etc/nginx/sites-available/sphero.dannyslab.com \
#     /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate, which rewrites this file in place to add
# the TLS server block and an HTTP->HTTPS redirect:
#   sudo certbot --nginx -d sphero.dannyslab.com
#
# HTTP only on purpose: certbot needs port 80 reachable to validate the
# domain, and it adds the TLS configuration itself afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name sphero.dannyslab.com;

    # Upstream is the container, bound to loopback so it cannot be
    # reached directly from outside. See HOST_BIND in docker-compose.yml.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
    }
}
