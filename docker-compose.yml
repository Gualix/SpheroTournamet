# Sphero Tournament — run the published image.
#
#   docker compose up -d          start
#   docker compose ps             status and health
#   docker compose logs -f        follow nginx logs
#   docker compose pull           fetch a newer image
#   docker compose down           stop and remove
#
# Override any value without editing this file, either inline:
#
#   IMAGE=acme/sphero-tournament TAG=v1.0.0 HOST_PORT=80 docker compose up -d
#
# or by creating a .env file next to this one:
#
#   IMAGE=acme/sphero-tournament
#   TAG=v1.0.0
#   HOST_PORT=80
#   HOST_BIND=127.0.0.1

services:
  app:
    image: ${IMAGE:-yourname/sphero-tournament}:${TAG:-latest}
    container_name: sphero-tournament
    restart: unless-stopped
    ports:
      # HOST_BIND defaults to all interfaces, so the app is reachable directly
      # on HOST_PORT. When running behind a reverse proxy, set
      # HOST_BIND=127.0.0.1 so only the proxy can reach the container.
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:80"

    # The image defines its own HEALTHCHECK, which `docker compose ps`
    # reports. Uncomment only to override it.
    #
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost/"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3

    # To build from this repository instead of pulling a published image,
    # uncomment the line below and run: docker compose up -d --build
    # Requires the full source tree, not just this file.
    #
    # build: .
